<script>
(function(){
'use strict';

// ---- three.js core setup ----
let scene,camera,renderer,composer;

  scene=new THREE.Scene();

  renderer=new THREE.WebGLRenderer({antialias:false});
  renderer.setPixelRatio(1);
  renderer.setSize(640,400,false);
  renderer.setClearColor(0x0d1a10);

  composer=new THREE.EffectComposer(renderer);
  composer.addPass(new THREE.RenderPass(scene,camera));
  const bloomPass=new THREE.UnrealBloomPass(new THREE.Vector2(224,140),0.72,0.4,0.2);
  composer.addPass(bloomPass);

  fxaaPass.uniforms.resolution.value.set(1/640,1/400);

}

// ---- cached DOM refs (avoid repeated getElementById on hot paths) ----

// ---- sound: lightweight synthesized SFX, no external audio files, muted by one master gain ----
let audioCtx=null,masterGain=null,muted=false,noiseBuffer=null;
function ensureAudio(){

    if(!audioCtx){
      audioCtx=new (window.AudioContext||window.webkitAudioContext)();
      masterGain=audioCtx.createGain();

function getNoiseBuffer(ctx){
  if(!noiseBuffer){
    const len=Math.floor(ctx.sampleRate*0.3);

}

  const ctx=ensureAudio();if(!ctx)return;
  const t=ctx.currentTime;

  gain.gain.exponentialRampToValueAtTime(0.001,t+duration);
  osc.connect(gain);gain.connect(masterGain);
  osc.start(t);osc.stop(t+duration);
}

  const ctx=ensureAudio();if(!ctx)return;

  filter.type='lowpass';filter.frequency.setValueAtTime(filterFreq,t);
  const gain=ctx.createGain();
  gain.gain.setValueAtTime(gainVal,t);
  gain.gain.exponentialRampToValueAtTime(0.001,t+duration);
  src.connect(filter);filter.connect(gain);gain.connect(masterGain);
  src.start(t);src.stop(t+duration);
}

function makeGroundTexture(){
  const c=document.createElement('canvas');c.width=256;c.height=256;

  for(let i=0;i<900;i++){
    const x=Math.random()*256,y=Math.random()*256,r=1+Math.random()*2.5;

const matShadowBlob=new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:0.35});
const matGoldPop=new THREE.MeshStandardMaterial({color:0xe8a33d,emissive:0xe8a33d,emissiveIntensity:2});
const matCritPop=new THREE.MeshStandardMaterial({color:0xffc860,emissive:0xffc860,emissiveIntensity:2.4});

// ---- ground ----
const ground=new THREE.Mesh(new THREE.PlaneGeometry(150,100),matGround);
ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);

// ---- tower (the only shadow-caster in the scene, keeping shadow cost fixed regardless of wave size) ----
const towerBase=new THREE.Mesh(geoCyl,matBark);
towerBase.scale.set(3,8,3);towerBase.position.y=4;towerBase.castShadow=true;
const towerRoof=new THREE.Mesh(geoCone,matDarkBark);
towerRoof.scale.set(4.2,6,4.2);towerRoof.position.y=11;towerRoof.castShadow=true;
const beacon=new THREE.Mesh(geoSphere,matEmber);
beacon.scale.setScalar(1.1);beacon.position.y=15;
const beaconLight=new THREE.PointLight(0xe8a33d,1.5,70,2);
beacon.add(beaconLight);
const towerShadowBlob=new THREE.Mesh(geoDisc,matShadowBlob);
towerShadowBlob.rotation.x=-Math.PI/2;towerShadowBlob.scale.setScalar(4.5);towerShadowBlob.position.y=0.04;
scene.add(towerBase,towerRoof,beacon,towerShadowBlob);

// range indicator - a unit ring scaled to the tower's current range each frame
const rangeRing=new THREE.Mesh(geoRing,matRange);
rangeRing.rotation.x=-Math.PI/2;rangeRing.position.y=0.1;
scene.add(rangeRing);

// ---- trees: instanced (2 draw calls total regardless of count) ----
const TREE_COUNT=34;
const trunkInst=new THREE.InstancedMesh(geoCyl,matBark,TREE_COUNT);
const foliageInst=new THREE.InstancedMesh(geoCone,matPine,TREE_COUNT*3);
trunkInst.frustumCulled=false;foliageInst.frustumCulled=false;
scene.add(trunkInst,foliageInst);
{
  const dummy=new THREE.Object3D();
  let fIdx=0;
  for(let i=0;i<TREE_COUNT;i++){
    let x,z;
    if(Math.random()<0.5){x=(Math.random()*2-1)*72;z=(Math.random()<0.5?-1:1)*(35+Math.random()*13);}
    else{x=(Math.random()<0.5?-1:1)*(62+Math.random()*11);z=(Math.random()*2-1)*47;}
    const s=7+Math.random()*4;
    dummy.position.set(x,s*0.5,z);dummy.scale.set(0.5,s,0.5);dummy.updateMatrix();
    trunkInst.setMatrixAt(i,dummy.matrix);
    for(let t=0;t<3;t++){
      const tierH=s*0.5,tierW=s*0.55*(1-t*0.25);
      dummy.position.set(x,s*0.6+t*tierH*0.6+tierH*0.5,z);dummy.scale.set(tierW,tierH,tierW);dummy.updateMatrix();
      foliageInst.setMatrixAt(fIdx++,dummy.matrix);
    }
  }
  trunkInst.instanceMatrix.needsUpdate=true;
  foliageInst.instanceMatrix.needsUpdate=true;
}

// ---- bushes: a second, denser instanced layer of ground-level clutter (also just 1 draw call) ----
const BUSH_COUNT=46;
const bushInst=new THREE.InstancedMesh(geoSphere,matBush,BUSH_COUNT);
bushInst.frustumCulled=false;
scene.add(bushInst);
{
  const dummy=new THREE.Object3D();
  for(let i=0;i<BUSH_COUNT;i++){
    let x,z;
    // scatter across the whole clearing, but leave a clear lane near the tower so the view stays readable
    do{
      x=(Math.random()*2-1)*70;
      z=(Math.random()*2-1)*46;
    }while(x*x+z*z<400);
    const s=1.1+Math.random()*1.5;
    dummy.position.set(x,s*0.4,z);
    dummy.rotation.set(0,Math.random()*Math.PI*2,0);
    dummy.scale.set(s,s*0.7,s);
    dummy.updateMatrix();
    bushInst.setMatrixAt(i,dummy.matrix);
  }
  bushInst.instanceMatrix.needsUpdate=true;
}

// ---- fireflies: one Points draw call for the whole swarm ----
function makeFireflies(){
  const n=40;
  const positions=new Float32Array(n*3);
  for(let i=0;i<n;i++){
    const ang=Math.random()*Math.PI*2,r=15+Math.random()*55;
    positions[i*3]=Math.cos(ang)*r;
    positions[i*3+1]=2+Math.random()*10;
    positions[i*3+2]=Math.sin(ang)*r;
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));
  const mat=new THREE.PointsMaterial({color:0xffc860,size:0.9,transparent:true,opacity:0.6,sizeAttenuation:true});
  return new THREE.Points(geo,mat);
}
const fireflies=makeFireflies();
scene.add(fireflies);

// ---- object pools: enemies, arrows, and particles are hidden+reused instead of destroyed ----
function buildEnemyMesh(){
  const g=new THREE.Group();
  const body=new THREE.Mesh(geoSphere,matOgreTemplate.clone());
  const eyeL=new THREE.Mesh(geoSphere,matEye);
  const eyeR=new THREE.Mesh(geoSphere,matEye);
  const hpGroup=new THREE.Group();
  const hpBg=new THREE.Mesh(geoBox,matHpBg);hpBg.scale.set(2.3,0.3,0.05);
  const hpFill=new THREE.Mesh(geoBox,matHpGreen);hpFill.scale.set(2.2,0.24,0.06);hpFill.position.z=0.01;
  hpGroup.add(hpBg,hpFill);
  const shadow=new THREE.Mesh(geoDisc,matShadowBlob);
  shadow.rotation.x=-Math.PI/2;shadow.position.y=0.03;
  g.add(body,eyeL,eyeR,hpGroup,shadow);
  g.userData={body,eyeL,eyeR,hpGroup,hpFill,shadow};
  return g;
}
const enemyPool=[];
function acquireEnemy(){let g=enemyPool.pop();if(!g){g=buildEnemyMesh();scene.add(g);}g.visible=true;return g;}
function releaseEnemy(g){g.visible=false;enemyPool.push(g);}

function buildArrowMesh(){
  const g=new THREE.Group();
  const shaft=new THREE.Mesh(geoCyl,matArrow);
  shaft.scale.set(0.18,2.2,0.18);shaft.rotation.z=Math.PI/2;
  g.add(shaft);
  return g;
}
const arrowPool=[];
function acquireArrow(){let g=arrowPool.pop();if(!g){g=buildArrowMesh();scene.add(g);}g.visible=true;return g;}
function releaseArrow(g){g.visible=false;arrowPool.push(g);}

const particlePool=[];
function acquireParticle(){let m=particlePool.pop();if(!m){m=new THREE.Mesh(geoSphere,matGoldPop);scene.add(m);}m.visible=true;return m;}
function releaseParticle(m){m.visible=false;particlePool.push(m);}
function spawnPop(x,y,z,mat){
  for(let i=0;i<5;i++){
    const m=acquireParticle();m.material=mat;m.position.set(x,y,z);m.scale.setScalar(0.35);
    const ang=Math.random()*Math.PI*2;
    particles.push({mesh:m,x,y,z,vx:Math.cos(ang)*2.5,vy:2+Math.random()*2,vz:Math.sin(ang)*2.5,life:0.5,maxLife:0.5});
  }
}

// ---- game state ----
let wave=0,gold=100,totalGold=0,running=true,waveActive=false;
let enemiesToSpawn=0,spawnTimer=0,currentWaveCfg=null,hitFlashTimer=0,elapsed=0,lastTime=0;
const enemies=[],arrows=[],particles=[];
const tower={x:0,z:0,hp:100,maxHp:100,damage:12,fireRate:1.3,range:28,arrowSpeed:78,critChance:0.05,cooldown:0};
const TOWER_HIT_R2=36;
const GROUND_HALF_W=75,GROUND_HALF_D=50;
const REPAIR_COST_PER_HP=1.4;

// ---- upgrades: costs tuned to stay affordable across a long campaign (add an entry here to expand) ----
const upgrades={
  hp:{name:'Tower HP',icon:'❤️',base:25,mult:1.3,lvl:0,apply:()=>{tower.maxHp+=20;tower.hp+=20;},display:()=>tower.maxHp},
  dmg:{name:'Damage',icon:'⚔️',base:30,mult:1.26,lvl:0,apply:()=>{tower.damage+=5;},display:()=>tower.damage},
  rate:{name:'Fire Rate',icon:'⚡',base:35,mult:1.3,lvl:0,apply:()=>{tower.fireRate=+(tower.fireRate+0.16).toFixed(2);},display:()=>tower.fireRate.toFixed(2)},
  range:{name:'Range',icon:'🎯',base:25,mult:1.24,lvl:0,apply:()=>{tower.range+=4;},display:()=>Math.round(tower.range)},
  aspd:{name:'Arrow Spd',icon:'🏹',base:20,mult:1.22,lvl:0,apply:()=>{tower.arrowSpeed+=12;},display:()=>Math.round(tower.arrowSpeed)},
  crit:{name:'Crit %',icon:'💥',base:40,mult:1.32,lvl:0,apply:()=>{tower.critChance=Math.min(0.75,tower.critChance+0.04);},display:()=>Math.round(tower.critChance*100)+'%'}
};
const upgradesPanel=document.getElementById('upgrades');
for(const key in upgrades){
  const btn=document.createElement('button');
  btn.className='upBtn';btn.id='u-'+key;
  btn.onclick=()=>buyUpgrade(key);
  upgradesPanel.appendChild(btn);
}
function upgradeCost(u){return Math.floor(u.base*Math.pow(u.mult,u.lvl));}
function buyUpgrade(key){
  const u=upgrades[key],cost=upgradeCost(u);
  if(gold<cost)return;
  gold-=cost;u.lvl++;u.apply();
  sfxUpgrade();
  updateHUD();
}
function renderUpgrades(){
  for(const key in upgrades){
    const u=upgrades[key],cost=upgradeCost(u),btn=document.getElementById('u-'+key);
    btn.innerHTML=`${u.icon} ${u.name}<br><span class="uval">${u.display()}</span> · <span class="ucost">${cost}g</span>`;
    btn.disabled=gold<cost;
  }
}
function repairCost(){return Math.ceil((tower.maxHp-tower.hp)*REPAIR_COST_PER_HP);}
function repairTower(){
  const cost=repairCost();
  if(cost<=0||gold<cost)return;
  gold-=cost;tower.hp=tower.maxHp;
  sfxRepair();
  updateHUD();
}
repairBtnEl.onclick=()=>repairTower();

// ---- wave scaling: enemy toughness now grows more gently than raw enemy count/numbers,
// and gold income was raised to match, so steady upgrading (helped by Repair between waves)
// can actually keep pace deep into a long run rather than being overtaken exponentially ----
function waveConfig(w){
  return{
    count:4+Math.floor(w*1.8),
    hp:Math.round(25*Math.pow(1.10,w-1)),
    speed:Math.min(18,7+w*0.35),
    goldReward:5+Math.floor(w*0.9),
    spawnInterval:Math.max(0.25,0.75-w*0.012)
  };
}
function startWave(){
  if(waveActive)return;
  wave++;
  currentWaveCfg=waveConfig(wave);
  enemiesToSpawn=currentWaveCfg.count;
  spawnTimer=0;waveActive=true;
  startWaveBtn.disabled=true;
  sfxWaveStart();
  updateHUD();
}
function spawnEnemyEdge(){
  const cfg=currentWaveCfg;
  let x,z;const edge=Math.floor(Math.random()*4);
  if(edge===0){x=-GROUND_HALF_W-6;z=(Math.random()*2-1)*GROUND_HALF_D;}
  else if(edge===1){x=GROUND_HALF_W+6;z=(Math.random()*2-1)*GROUND_HALF_D;}
  else if(edge===2){z=-GROUND_HALF_D-6;x=(Math.random()*2-1)*GROUND_HALF_W;}
  else{z=GROUND_HALF_D+6;x=(Math.random()*2-1)*GROUND_HALF_W;}
  const dx=-x,dz=-z,d=Math.hypot(dx,dz);
  const mesh=acquireEnemy();
  enemies.push({x,z,dx:dx/d,dz:dz/d,hp:cfg.hp,maxHp:cfg.hp,speed:cfg.speed,size:2.6+Math.min(1.5,wave*0.05),goldReward:cfg.goldReward,hitFlash:0,phase:Math.random()*10,active:true,mesh});
}

// ---- update ----
function updateSpawning(dt){
  if(!waveActive)return;
  if(enemiesToSpawn>0){
    spawnTimer-=dt;
    if(spawnTimer<=0){spawnEnemyEdge();enemiesToSpawn--;spawnTimer=currentWaveCfg.spawnInterval;updateHUD();}
  }else if(enemies.length===0){
    waveActive=false;
    const bonus=Math.round(12+wave*2.5);gold+=bonus;totalGold+=bonus;
    startWaveBtn.disabled=false;startWaveBtn.textContent=`Start Wave ${wave+1}`;
    sfxWaveClear();
    updateHUD();
  }
}
function syncEnemy(e){
  const g=e.mesh,u=g.userData;
  g.position.set(e.x,0,e.z);
  const bob=Math.sin(elapsed*6+e.phase)*0.25;
  u.body.position.y=e.size*0.85+bob;
  u.body.scale.set(e.size,e.size*0.9,e.size*1.05);
  u.body.material.color.setHex(e.hitFlash>0?0xffffff:0x4a6b3a);
  const eyeY=u.body.position.y+e.size*0.2,eyeZ=e.size*0.9;
  u.eyeL.position.set(-e.size*0.32,eyeY,eyeZ);u.eyeL.scale.setScalar(e.size*0.13);
  u.eyeR.position.set(e.size*0.32,eyeY,eyeZ);u.eyeR.scale.setScalar(e.size*0.13);
  u.hpGroup.position.y=e.size*2+bob;
  u.hpGroup.quaternion.copy(camera.quaternion);
  u.shadow.scale.setScalar(e.size*1.3);
  const ratio=Math.max(0,e.hp/e.maxHp);
  u.hpFill.scale.x=2.2*ratio;
  u.hpFill.position.x=-(2.2-2.2*ratio)/2;
  u.hpFill.material=ratio>0.5?matHpGreen:ratio>0.25?matHpOrange:matHpRed;
}
function updateEnemies(dt){
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    e.x+=e.dx*e.speed*dt;e.z+=e.dz*e.speed*dt;
    if(e.hitFlash>0)e.hitFlash-=dt;
    if(e.x*e.x+e.z*e.z<TOWER_HIT_R2){
      const dmg=6+Math.floor(wave*0.4);
      tower.hp=Math.max(0,tower.hp-dmg);
      e.active=false;releaseEnemy(e.mesh);enemies.splice(i,1);hitFlashTimer=0.2;
      sfxTowerHit();
      updateHUD();
      if(tower.hp<=0){gameOver();return;}
      continue;
    }
    if(e.hp<=0){
      e.active=false;
      gold+=e.goldReward;totalGold+=e.goldReward;
      spawnPop(e.x,e.size*1.5,e.z,matGoldPop);
      sfxGold();
      releaseEnemy(e.mesh);enemies.splice(i,1);
      updateHUD();
      continue;
    }
    syncEnemy(e);
  }
}
function findTarget(){
  let best=null,bestD=tower.range*tower.range;
  for(const e of enemies){
    const dx=e.x-tower.x,dz=e.z-tower.z,d=dx*dx+dz*dz;
    if(d<=bestD){bestD=d;best=e;}
  }
  return best;
}
function updateTower(dt){
  tower.cooldown-=dt;
  if(tower.cooldown<=0){
    const t=findTarget();
    if(t){
      const isCrit=Math.random()<tower.critChance;
      const mesh=acquireArrow();
      arrows.push({x:0,z:0,target:t,speed:tower.arrowSpeed,damage:isCrit?tower.damage*2:tower.damage,isCrit,age:0,mesh});
      sfxFire();
      tower.cooldown=1/tower.fireRate;
    }
  }
}
function updateArrows(dt){
  for(let i=arrows.length-1;i>=0;i--){
    const a=arrows[i],t=a.target;
    if(!t.active){releaseArrow(a.mesh);arrows.splice(i,1);continue;}
    const ddx=t.x-a.x,ddz=t.z-a.z,dist=Math.hypot(ddx,ddz);
    a.age+=dt;
    if(dist<2.2){
      t.hp-=a.damage;t.hitFlash=0.1;
      if(a.isCrit){spawnPop(t.x,t.size*1.3,t.z,matCritPop);sfxCrit();}
      else sfxHit();
      releaseArrow(a.mesh);arrows.splice(i,1);continue;
    }
    const dirX=ddx/dist,dirZ=ddz/dist;
    a.x+=dirX*a.speed*dt;a.z+=dirZ*a.speed*dt;
    const prog=Math.min(1,a.age/0.5);
    const arcY=14+Math.sin(prog*Math.PI)*4;
    a.mesh.position.set(a.x,arcY,a.z);
    a.mesh.rotation.y=Math.atan2(-dirZ,dirX);
  }
}
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.vy-=6*dt;
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;
    p.life-=dt;
    if(p.life<=0){releaseParticle(p.mesh);particles.splice(i,1);continue;}
    p.mesh.position.set(p.x,Math.max(0.1,p.y),p.z);
    p.mesh.scale.setScalar(0.35*(p.life/p.maxLife));
  }
}

// ---- camera: fixed elevated angle with a slow gentle sway ----
function updateCamera(){
  const theta=Math.sin(elapsed*0.06)*0.18;
  camera.position.set(Math.sin(theta)*115,96,Math.cos(theta)*115);
  camera.lookAt(0,8,0);
}
function syncTower(){
  beacon.position.y=15+Math.sin(elapsed*2.2)*0.4;
}
function syncRangeRing(){
  rangeRing.scale.set(tower.range,tower.range,1);
}
function syncFireflies(){
  fireflies.material.opacity=0.4+Math.sin(elapsed*1.4)*0.2;
  fireflies.rotation.y=elapsed*0.02;
}

// ---- HUD ----
function updateHUD(){
  waveNumEl.textContent=wave===0?'—':wave;
  goldEl.textContent=gold;
  hpTextEl.textContent=Math.ceil(tower.hp)+'/'+tower.maxHp;
  hpBarFillEl.style.width=Math.max(0,tower.hp/tower.maxHp*100)+'%';
  if(waveActive)startWaveBtn.textContent=`Enemies: ${enemies.length+enemiesToSpawn}`;
  const missing=tower.maxHp-tower.hp;
  if(missing<=0){repairBtnEl.textContent='🔧 Repaired';repairBtnEl.disabled=true;}
  else{const c=repairCost();repairBtnEl.textContent=`🔧 Repair (${c}g)`;repairBtnEl.disabled=gold<c;}
  renderUpgrades();
}

// ---- game flow ----
function gameOver(){
  running=false;
  finalWaveEl.textContent=wave;
  finalGoldEl.textContent=totalGold;
  gameOverOverlayEl.classList.remove('hidden');
  sfxGameOver();
}
function resetGame(){
  wave=0;gold=100;totalGold=0;running=true;waveActive=false;enemiesToSpawn=0;spawnTimer=0;hitFlashTimer=0;
  tower.hp=100;tower.maxHp=100;tower.damage=12;tower.fireRate=1.3;tower.range=28;tower.arrowSpeed=78;tower.critChance=0.05;tower.cooldown=0;
  for(const k in upgrades)upgrades[k].lvl=0;
  enemies.forEach(e=>releaseEnemy(e.mesh));enemies.length=0;
  arrows.forEach(a=>releaseArrow(a.mesh));arrows.length=0;
  particles.forEach(p=>releaseParticle(p.mesh));particles.length=0;
  startWaveBtn.disabled=false;startWaveBtn.textContent='Start Wave 1';
  gameOverOverlayEl.classList.add('hidden');
  updateHUD();
}

// ---- events ----
startWaveBtn.onclick=startWave;
document.getElementById('restartBtn').onclick=resetGame;
document.getElementById('miniRestart').onclick=resetGame;

// ---- render & main loop ----
function render(){
  updateCamera();
  syncTower();
  syncRangeRing();
  syncFireflies();
  composer.render();
}
function loop(ts){
  const dt=Math.min((ts-lastTime)/1000,0.05);
  lastTime=ts;elapsed+=dt;
  if(running){
    updateSpawning(dt);updateEnemies(dt);updateTower(dt);updateArrows(dt);updateParticles(dt);
    if(hitFlashTimer>0)hitFlashTimer=Math.max(0,hitFlashTimer-dt);
  }
  hitFlashEl.style.opacity=hitFlashTimer>0?(hitFlashTimer/0.2)*0.5:0;
  render();
  requestAnimationFrame(loop);
}
updateHUD();
requestAnimationFrame(loop);
})();

</script>
