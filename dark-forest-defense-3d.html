<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dark Forest Defense 3D</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/128/three.min.js"></script>
<style>
:root{
  --pine:#0a1510;
  --moss-deep:#17281a;
  --line:#3d5c3a;
  --moss:#4a7a3f;
  --moss-bright:#639950;
  --bark:#4a3728;
  --ember:#e8a33d;
  --ember-bright:#ffc860;
  --moonlight:#d9e4d2;
  --moonlight-dim:#8aa382;
  --blood:#b8433c;
  --blood-bright:#d9564d;
  --panel-bg:rgba(23,40,26,0.92);
}
*{box-sizing:border-box;}
body{
  margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at center,var(--moss-deep) 0%,var(--pine) 100%);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  color:var(--moonlight);padding:16px;user-select:none;
}
#game{width:100%;max-width:820px;display:flex;flex-direction:column;gap:10px;}
h1{
  font-family:Rockwell,'Bookman Old Style',Georgia,serif;text-align:center;margin:0;
  font-size:1.6rem;letter-spacing:0.5px;color:var(--ember);
  text-shadow:0 0 16px rgba(232,163,61,0.45);
}
.subtitle{text-align:center;margin:2px 0 4px;font-size:0.8rem;color:var(--moonlight-dim);}
#hud{
  display:flex;flex-wrap:wrap;align-items:center;gap:14px;background:var(--panel-bg);
  border:1px solid var(--line);border-radius:8px;padding:10px 14px;
}
.stat{display:flex;align-items:center;gap:5px;font-weight:600;font-size:0.95rem;white-space:nowrap;font-variant-numeric:tabular-nums;}
#gold{color:var(--ember);}
.hpWrap{display:flex;align-items:center;gap:6px;}
.hpBarOuter{width:110px;height:10px;background:#1c1c1c;border-radius:5px;overflow:hidden;border:1px solid #333;}
#hpBarFill{height:100%;background:linear-gradient(90deg,var(--blood),var(--blood-bright));width:100%;transition:width .2s;}
@media(prefers-reduced-motion:reduce){#hpBarFill{transition:none;}}
#startWaveBtn{
  margin-left:auto;background:linear-gradient(180deg,var(--moss-bright),var(--moss));color:#fff;
  border:1px solid var(--moss-bright);border-radius:6px;padding:9px 16px;font-weight:700;
  cursor:pointer;font-size:0.9rem;font-variant-numeric:tabular-nums;
}
#startWaveBtn:disabled{opacity:.75;cursor:default;}
#startWaveBtn:not(:disabled):hover{filter:brightness(1.15);}
#miniRestart{
  background:none;border:1px solid var(--line);color:var(--moonlight-dim);border-radius:6px;
  padding:8px 10px;cursor:pointer;font-size:0.9rem;
}
#miniRestart:hover{color:var(--moonlight);border-color:var(--moonlight-dim);}
button:focus-visible{outline:2px solid var(--ember-bright);outline-offset:2px;}
#canvasWrap{
  position:relative;border:3px solid var(--bark);border-radius:8px;overflow:hidden;
  box-shadow:0 4px 20px rgba(0,0,0,0.5);background:var(--pine);aspect-ratio:8/5;
}
#canvasWrap canvas{display:block;width:100%;height:100%;}
#hitFlash{position:absolute;inset:0;background:var(--blood);opacity:0;pointer-events:none;}
#webglFallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:20px;color:var(--moonlight-dim);font-size:0.85rem;}
#upgrades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.upBtn{
  background:var(--panel-bg);border:1px solid var(--line);color:var(--moonlight);border-radius:7px;
  padding:8px 6px;cursor:pointer;font-size:0.78rem;line-height:1.5;text-align:center;
  transition:background .15s,border-color .15s;font-variant-numeric:tabular-nums;
}
.upBtn:hover:not(:disabled){background:rgba(74,122,63,0.3);border-color:var(--moss);}
.upBtn:disabled{opacity:.4;cursor:not-allowed;}
.uval{color:var(--ember);font-weight:700;}
.ucost{color:var(--moonlight-dim);font-size:0.72rem;}
#gameOverOverlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.82);display:flex;
  align-items:center;justify-content:center;z-index:10;
}
#gameOverOverlay.hidden{display:none;}
#gameOverPanel{background:var(--panel-bg);border:1px solid var(--line);border-radius:10px;padding:28px 36px;text-align:center;}
#gameOverPanel h2{color:var(--blood-bright);margin-top:0;font-family:Rockwell,'Bookman Old Style',Georgia,serif;}
#restartBtn{
  margin-top:14px;background:linear-gradient(180deg,var(--moss-bright),var(--moss));color:#fff;
  border:1px solid var(--moss-bright);border-radius:6px;padding:10px 22px;font-weight:700;
  cursor:pointer;font-size:0.95rem;
}
#restartBtn:hover{filter:brightness(1.15);}
@media(max-width:520px){
  #upgrades{grid-template-columns:repeat(2,1fr);}
  .stat{font-size:0.82rem;}
  h1{font-size:1.25rem;}
  #startWaveBtn{margin-left:0;width:100%;order:10;}
}
</style>
</head>
<body>
<div id="game">
  <h1>🌲 Dark Forest Defense</h1>
  <p class="subtitle">Defend your tower from waves of ogres — now in 3D</p>
  <div id="hud">
    <div class="stat">🌊 Wave <span id="waveNum">—</span></div>
    <div class="stat">💰 <span id="gold">100</span></div>
    <div class="stat hpWrap">❤️ <span id="hpText">100/100</span>
      <div class="hpBarOuter"><div id="hpBarFill"></div></div>
    </div>
    <button id="miniRestart" title="Restart">↺</button>
    <button id="startWaveBtn">Start Wave 1</button>
  </div>
  <div id="canvasWrap">
    <div id="hitFlash"></div>
    <div id="webglFallback">Your browser doesn't support WebGL, which this 3D game needs. Try updating your browser or graphics drivers.</div>
  </div>
  <div id="upgrades"></div>
</div>
<div id="gameOverOverlay" class="hidden">
  <div id="gameOverPanel">
    <h2>💀 Game Over</h2>
    <p>Reached Wave <b id="finalWave">0</b></p>
    <p>Total Gold Earned: <b id="finalGold">0</b></p>
    <button id="restartBtn">Restart</button>
  </div>
</div>
<script>
(function(){
'use strict';

// ---- three.js core setup ----
let scene,camera,renderer;
try{
  scene=new THREE.Scene();
  scene.fog=new THREE.Fog(0x0d1a10,70,190);
  camera=new THREE.PerspectiveCamera(50,8/5,0.5,500);
  renderer=new THREE.WebGLRenderer({antialias:false});
  renderer.setPixelRatio(1);
  renderer.setSize(640,400,false);
  renderer.setClearColor(0x0d1a10);
  renderer.domElement.style.cssText='display:block;width:100%;height:100%;';
  document.getElementById('canvasWrap').appendChild(renderer.domElement);
}catch(err){
  document.getElementById('webglFallback').style.display='flex';
  return;
}
const hitFlashEl=document.getElementById('hitFlash');
const startWaveBtn=document.getElementById('startWaveBtn');

// ---- lights ----
scene.add(new THREE.HemisphereLight(0x3a5c46,0x0a1510,0.9));
const moonLight=new THREE.DirectionalLight(0x6f88a0,0.35);
moonLight.position.set(-40,60,-20);
scene.add(moonLight);

// ---- shared geometries & materials (reused everywhere, never recreated per-object) ----
const geoSphere=new THREE.SphereGeometry(1,10,7);
const geoBox=new THREE.BoxGeometry(1,1,1);
const geoCone=new THREE.ConeGeometry(1,1,7);
const geoCyl=new THREE.CylinderGeometry(1,1,1,7);
const geoRing=new THREE.RingGeometry(0.94,1,32);

const matBark=new THREE.MeshLambertMaterial({color:0x4a3728});
const matDarkBark=new THREE.MeshLambertMaterial({color:0x2e2117});
const matPine=new THREE.MeshLambertMaterial({color:0x132218});
const matGround=new THREE.MeshLambertMaterial({color:0x17281a});
const matEmber=new THREE.MeshBasicMaterial({color:0xe8a33d});
const matEye=new THREE.MeshBasicMaterial({color:0xe8483d});
const matOgreTemplate=new THREE.MeshLambertMaterial({color:0x4a6b3a});
const matHpBg=new THREE.MeshBasicMaterial({color:0x1c1c1c});
const matHpGreen=new THREE.MeshBasicMaterial({color:0x4a7a3f});
const matHpOrange=new THREE.MeshBasicMaterial({color:0xe8a33d});
const matHpRed=new THREE.MeshBasicMaterial({color:0xb8433c});
const matRange=new THREE.MeshBasicMaterial({color:0x639950,transparent:true,opacity:0.16,side:THREE.DoubleSide});
const matGoldPop=new THREE.MeshBasicMaterial({color:0xe8a33d});
const matCritPop=new THREE.MeshBasicMaterial({color:0xffc860});

// ---- ground ----
const ground=new THREE.Mesh(new THREE.PlaneGeometry(150,100),matGround);
ground.rotation.x=-Math.PI/2;
scene.add(ground);

// ---- tower ----
const towerBase=new THREE.Mesh(geoCyl,matBark);
towerBase.scale.set(3,8,3);towerBase.position.y=4;
const towerRoof=new THREE.Mesh(geoCone,matDarkBark);
towerRoof.scale.set(4.2,6,4.2);towerRoof.position.y=11;
const beacon=new THREE.Mesh(geoSphere,matEmber);
beacon.scale.setScalar(1.1);beacon.position.y=15;
const beaconLight=new THREE.PointLight(0xe8a33d,1.4,70,2);
beacon.add(beaconLight);
scene.add(towerBase,towerRoof,beacon);

// range indicator - a unit ring scaled to the tower's current range each frame
const rangeRing=new THREE.Mesh(geoRing,matRange);
rangeRing.rotation.x=-Math.PI/2;rangeRing.position.y=0.1;
scene.add(rangeRing);

// ---- trees, scattered around the clearing's edge ----
for(let i=0;i<20;i++){
  let x,z;
  if(Math.random()<0.5){x=(Math.random()*2-1)*72;z=(Math.random()<0.5?-1:1)*(38+Math.random()*10);}
  else{x=(Math.random()<0.5?-1:1)*(65+Math.random()*8);z=(Math.random()*2-1)*47;}
  const s=7+Math.random()*4;
  const trunk=new THREE.Mesh(geoCyl,matBark);
  trunk.scale.set(0.5,s,0.5);trunk.position.set(x,s*0.5,z);
  scene.add(trunk);
  for(let t=0;t<3;t++){
    const tierH=s*0.5,tierW=s*0.55*(1-t*0.25);
    const cone=new THREE.Mesh(geoCone,matPine);
    cone.scale.set(tierW,tierH,tierW);
    cone.position.set(x,s*0.6+t*tierH*0.6+tierH*0.5,z);
    scene.add(cone);
  }
}

// ---- object pools: enemies, arrows, and particles are hidden+reused instead of destroyed ----
function buildEnemyMesh(){
  const g=new THREE.Group();
  const body=new THREE.Mesh(geoSphere,matOgreTemplate.clone());
  const eyeL=new THREE.Mesh(geoSphere,matEye);
  const eyeR=new THREE.Mesh(geoSphere,matEye);
  const hpGroup=new THREE.Group();
  const hpBg=new THREE.Mesh(geoBox,matHpBg);hpBg.scale.set(2.3,0.3,0.05);
  const hpFill=new THREE.Mesh(geoBox,matHpGreen);hpFill.scale.set(2.2,0.24,0.06);hpFill.position.z=0.01;
  hpGroup.add(hpBg,hpFill);
  g.add(body,eyeL,eyeR,hpGroup);
  g.userData={body,eyeL,eyeR,hpGroup,hpFill};
  return g;
}
const enemyPool=[];
function acquireEnemy(){let g=enemyPool.pop();if(!g){g=buildEnemyMesh();scene.add(g);}g.visible=true;return g;}
function releaseEnemy(g){g.visible=false;enemyPool.push(g);}

function buildArrowMesh(){
  const g=new THREE.Group();
  const shaft=new THREE.Mesh(geoCyl,matEmber);
  shaft.scale.set(0.18,2.2,0.18);shaft.rotation.z=Math.PI/2;
  g.add(shaft);
  return g;
}
const arrowPool=[];
function acquireArrow(){let g=arrowPool.pop();if(!g){g=buildArrowMesh();scene.add(g);}g.visible=true;return g;}
function releaseArrow(g){g.visible=false;arrowPool.push(g);}

const particlePool=[];
function acquireParticle(){let m=particlePool.pop();if(!m){m=new THREE.Mesh(geoSphere,matGoldPop);scene.add(m);}m.visible=true;return m;}
function releaseParticle(m){m.visible=false;particlePool.push(m);}
function spawnPop(x,y,z,mat){
  for(let i=0;i<5;i++){
    const m=acquireParticle();m.material=mat;m.position.set(x,y,z);m.scale.setScalar(0.35);
    const ang=Math.random()*Math.PI*2;
    particles.push({mesh:m,x,y,z,vx:Math.cos(ang)*2.5,vy:2+Math.random()*2,vz:Math.sin(ang)*2.5,life:0.5,maxLife:0.5});
  }
}

// ---- game state ----
let wave=0,gold=100,totalGold=0,running=true,waveActive=false;
let enemiesToSpawn=0,spawnTimer=0,currentWaveCfg=null,hitFlashTimer=0,elapsed=0,lastTime=0;
const enemies=[],arrows=[],particles=[];
const tower={x:0,z:0,hp:100,maxHp:100,damage:12,fireRate:1.3,range:28,arrowSpeed:78,critChance:0.05,cooldown:0};
const TOWER_HIT_R2=36;
const GROUND_HALF_W=75,GROUND_HALF_D=50;

// ---- upgrades (add a new entry here + apply/display fns to expand) ----
const upgrades={
  hp:{name:'Tower HP',icon:'❤️',base:25,mult:1.35,lvl:0,apply:()=>{tower.maxHp+=20;tower.hp+=20;},display:()=>tower.maxHp},
  dmg:{name:'Damage',icon:'⚔️',base:30,mult:1.3,lvl:0,apply:()=>{tower.damage+=4;},display:()=>tower.damage},
  rate:{name:'Fire Rate',icon:'⚡',base:35,mult:1.35,lvl:0,apply:()=>{tower.fireRate=+(tower.fireRate+0.15).toFixed(2);},display:()=>tower.fireRate.toFixed(2)},
  range:{name:'Range',icon:'🎯',base:25,mult:1.28,lvl:0,apply:()=>{tower.range+=4;},display:()=>Math.round(tower.range)},
  aspd:{name:'Arrow Spd',icon:'🏹',base:20,mult:1.25,lvl:0,apply:()=>{tower.arrowSpeed+=12;},display:()=>Math.round(tower.arrowSpeed)},
  crit:{name:'Crit %',icon:'💥',base:40,mult:1.4,lvl:0,apply:()=>{tower.critChance=Math.min(0.75,tower.critChance+0.04);},display:()=>Math.round(tower.critChance*100)+'%'}
};
const upgradesPanel=document.getElementById('upgrades');
for(const key in upgrades){
  const btn=document.createElement('button');
  btn.className='upBtn';btn.id='u-'+key;
  btn.onclick=()=>buyUpgrade(key);
  upgradesPanel.appendChild(btn);
}
function upgradeCost(u){return Math.floor(u.base*Math.pow(u.mult,u.lvl));}
function buyUpgrade(key){
  const u=upgrades[key],cost=upgradeCost(u);
  if(gold<cost)return;
  gold-=cost;u.lvl++;u.apply();
  updateHUD();
}
function renderUpgrades(){
  for(const key in upgrades){
    const u=upgrades[key],cost=upgradeCost(u),btn=document.getElementById('u-'+key);
    btn.innerHTML=`${u.icon} ${u.name}<br><span class="uval">${u.display()}</span> · <span class="ucost">${cost}g</span>`;
    btn.disabled=gold<cost;
  }
}

// ---- wave scaling (same formulas as the 2D version - tweak here to rebalance) ----
function waveConfig(w){
  return{
    count:4+Math.floor(w*1.8),
    hp:Math.round(25*Math.pow(1.13,w-1)),
    speed:Math.min(18,7+w*0.4),
    goldReward:4+Math.floor(w*0.6),
    spawnInterval:Math.max(0.25,0.75-w*0.015)
  };
}
function startWave(){
  if(waveActive)return;
  wave++;
  currentWaveCfg=waveConfig(wave);
  enemiesToSpawn=currentWaveCfg.count;
  spawnTimer=0;waveActive=true;
  startWaveBtn.disabled=true;
  updateHUD();
}
function spawnEnemyEdge(){
  const cfg=currentWaveCfg;
  let x,z;const edge=Math.floor(Math.random()*4);
  if(edge===0){x=-GROUND_HALF_W-6;z=(Math.random()*2-1)*GROUND_HALF_D;}
  else if(edge===1){x=GROUND_HALF_W+6;z=(Math.random()*2-1)*GROUND_HALF_D;}
  else if(edge===2){z=-GROUND_HALF_D-6;x=(Math.random()*2-1)*GROUND_HALF_W;}
  else{z=GROUND_HALF_D+6;x=(Math.random()*2-1)*GROUND_HALF_W;}
  const dx=-x,dz=-z,d=Math.hypot(dx,dz);
  const mesh=acquireEnemy();
  enemies.push({x,z,dx:dx/d,dz:dz/d,hp:cfg.hp,maxHp:cfg.hp,speed:cfg.speed,size:2.6+Math.min(1.5,wave*0.05),goldReward:cfg.goldReward,hitFlash:0,phase:Math.random()*10,active:true,mesh});
}

// ---- update ----
function updateSpawning(dt){
  if(!waveActive)return;
  if(enemiesToSpawn>0){
    spawnTimer-=dt;
    if(spawnTimer<=0){spawnEnemyEdge();enemiesToSpawn--;spawnTimer=currentWaveCfg.spawnInterval;updateHUD();}
  }else if(enemies.length===0){
    waveActive=false;
    const bonus=10+wave*2;gold+=bonus;totalGold+=bonus;
    startWaveBtn.disabled=false;startWaveBtn.textContent=`Start Wave ${wave+1}`;
    updateHUD();
  }
}
function syncEnemy(e){
  const g=e.mesh,u=g.userData;
  g.position.set(e.x,0,e.z);
  const bob=Math.sin(elapsed*6+e.phase)*0.25;
  u.body.position.y=e.size*0.85+bob;
  u.body.scale.set(e.size,e.size*0.9,e.size*1.05);
  u.body.material.color.setHex(e.hitFlash>0?0xffffff:0x4a6b3a);
  const eyeY=u.body.position.y+e.size*0.2,eyeZ=e.size*0.9;
  u.eyeL.position.set(-e.size*0.32,eyeY,eyeZ);u.eyeL.scale.setScalar(e.size*0.13);
  u.eyeR.position.set(e.size*0.32,eyeY,eyeZ);u.eyeR.scale.setScalar(e.size*0.13);
  u.hpGroup.position.y=e.size*2+bob;
  u.hpGroup.quaternion.copy(camera.quaternion);
  const ratio=Math.max(0,e.hp/e.maxHp);
  u.hpFill.scale.x=2.2*ratio;
  u.hpFill.position.x=-(2.2-2.2*ratio)/2;
  u.hpFill.material=ratio>0.5?matHpGreen:ratio>0.25?matHpOrange:matHpRed;
}
function updateEnemies(dt){
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    e.x+=e.dx*e.speed*dt;e.z+=e.dz*e.speed*dt;
    if(e.hitFlash>0)e.hitFlash-=dt;
    if(e.x*e.x+e.z*e.z<TOWER_HIT_R2){
      const dmg=6+Math.floor(wave*0.4);
      tower.hp=Math.max(0,tower.hp-dmg);
      e.active=false;releaseEnemy(e.mesh);enemies.splice(i,1);hitFlashTimer=0.2;
      updateHUD();
      if(tower.hp<=0){gameOver();return;}
      continue;
    }
    if(e.hp<=0){
      e.active=false;
      gold+=e.goldReward;totalGold+=e.goldReward;
      spawnPop(e.x,e.size*1.5,e.z,matGoldPop);
      releaseEnemy(e.mesh);enemies.splice(i,1);
      updateHUD();
      continue;
    }
    syncEnemy(e);
  }
}
function findTarget(){
  let best=null,bestD=tower.range*tower.range;
  for(const e of enemies){
    const dx=e.x-tower.x,dz=e.z-tower.z,d=dx*dx+dz*dz;
    if(d<=bestD){bestD=d;best=e;}
  }
  return best;
}
function updateTower(dt){
  tower.cooldown-=dt;
  if(tower.cooldown<=0){
    const t=findTarget();
    if(t){
      const isCrit=Math.random()<tower.critChance;
      const mesh=acquireArrow();
      arrows.push({x:0,z:0,target:t,speed:tower.arrowSpeed,damage:isCrit?tower.damage*2:tower.damage,isCrit,age:0,mesh});
      tower.cooldown=1/tower.fireRate;
    }
  }
}
function updateArrows(dt){
  for(let i=arrows.length-1;i>=0;i--){
    const a=arrows[i],t=a.target;
    if(!t.active){releaseArrow(a.mesh);arrows.splice(i,1);continue;}
    const ddx=t.x-a.x,ddz=t.z-a.z,dist=Math.hypot(ddx,ddz);
    a.age+=dt;
    if(dist<2.2){
      t.hp-=a.damage;t.hitFlash=0.1;
      if(a.isCrit)spawnPop(t.x,t.size*1.3,t.z,matCritPop);
      releaseArrow(a.mesh);arrows.splice(i,1);continue;
    }
    const dirX=ddx/dist,dirZ=ddz/dist;
    a.x+=dirX*a.speed*dt;a.z+=dirZ*a.speed*dt;
    const prog=Math.min(1,a.age/0.5);
    const arcY=14+Math.sin(prog*Math.PI)*4;
    a.mesh.position.set(a.x,arcY,a.z);
    a.mesh.rotation.y=Math.atan2(-dirZ,dirX);
  }
}
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.vy-=6*dt;
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;
    p.life-=dt;
    if(p.life<=0){releaseParticle(p.mesh);particles.splice(i,1);continue;}
    p.mesh.position.set(p.x,Math.max(0.1,p.y),p.z);
    p.mesh.scale.setScalar(0.35*(p.life/p.maxLife));
  }
}

// ---- camera: fixed elevated angle with a slow gentle sway ----
function updateCamera(){
  const theta=Math.sin(elapsed*0.06)*0.18;
  camera.position.set(Math.sin(theta)*115,96,Math.cos(theta)*115);
  camera.lookAt(0,8,0);
}
function syncTower(){
  beacon.position.y=15+Math.sin(elapsed*2.2)*0.4;
}
function syncRangeRing(){
  rangeRing.scale.set(tower.range,tower.range,1);
}

// ---- HUD ----
function updateHUD(){
  document.getElementById('waveNum').textContent=wave===0?'—':wave;
  document.getElementById('gold').textContent=gold;
  document.getElementById('hpText').textContent=Math.ceil(tower.hp)+'/'+tower.maxHp;
  document.getElementById('hpBarFill').style.width=Math.max(0,tower.hp/tower.maxHp*100)+'%';
  if(waveActive)startWaveBtn.textContent=`Enemies: ${enemies.length+enemiesToSpawn}`;
  renderUpgrades();
}

// ---- game flow ----
function gameOver(){
  running=false;
  document.getElementById('finalWave').textContent=wave;
  document.getElementById('finalGold').textContent=totalGold;
  document.getElementById('gameOverOverlay').classList.remove('hidden');
}
function resetGame(){
  wave=0;gold=100;totalGold=0;running=true;waveActive=false;enemiesToSpawn=0;spawnTimer=0;hitFlashTimer=0;
  tower.hp=100;tower.maxHp=100;tower.damage=12;tower.fireRate=1.3;tower.range=28;tower.arrowSpeed=78;tower.critChance=0.05;tower.cooldown=0;
  for(const k in upgrades)upgrades[k].lvl=0;
  enemies.forEach(e=>releaseEnemy(e.mesh));enemies.length=0;
  arrows.forEach(a=>releaseArrow(a.mesh));arrows.length=0;
  particles.forEach(p=>releaseParticle(p.mesh));particles.length=0;
  startWaveBtn.disabled=false;startWaveBtn.textContent='Start Wave 1';
  document.getElementById('gameOverOverlay').classList.add('hidden');
  updateHUD();
}

// ---- events ----
startWaveBtn.onclick=startWave;
document.getElementById('restartBtn').onclick=resetGame;
document.getElementById('miniRestart').onclick=resetGame;

// ---- render & main loop ----
function render(){
  updateCamera();
  syncTower();
  syncRangeRing();
  renderer.render(scene,camera);
}
function loop(ts){
  const dt=Math.min((ts-lastTime)/1000,0.05);
  lastTime=ts;elapsed+=dt;
  if(running){
    updateSpawning(dt);updateEnemies(dt);updateTower(dt);updateArrows(dt);updateParticles(dt);
    if(hitFlashTimer>0)hitFlashTimer=Math.max(0,hitFlashTimer-dt);
  }
  hitFlashEl.style.opacity=hitFlashTimer>0?(hitFlashTimer/0.2)*0.5:0;
  render();
  requestAnimationFrame(loop);
}
updateHUD();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
