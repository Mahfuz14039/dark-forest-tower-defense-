<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dark Forest Defense</title>
<style>
:root{
  --pine:#0a1510;
  --moss-deep:#17281a;
  --line:#3d5c3a;
  --moss:#4a7a3f;
  --moss-bright:#639950;
  --bark:#4a3728;
  --ember:#e8a33d;
  --ember-bright:#ffc860;
  --moonlight:#d9e4d2;
  --moonlight-dim:#8aa382;
  --blood:#b8433c;
  --blood-bright:#d9564d;
  --panel-bg:rgba(23,40,26,0.92);
}
*{box-sizing:border-box;}
body{
  margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at center,var(--moss-deep) 0%,var(--pine) 100%);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  color:var(--moonlight);padding:16px;user-select:none;
}
#game{width:100%;max-width:820px;display:flex;flex-direction:column;gap:10px;}
h1{
  font-family:Rockwell,'Bookman Old Style',Georgia,serif;text-align:center;margin:0;
  font-size:1.6rem;letter-spacing:0.5px;color:var(--ember);
  text-shadow:0 0 16px rgba(232,163,61,0.45);
}
.subtitle{text-align:center;margin:2px 0 4px;font-size:0.8rem;color:var(--moonlight-dim);}
#hud{
  display:flex;flex-wrap:wrap;align-items:center;gap:14px;background:var(--panel-bg);
  border:1px solid var(--line);border-radius:8px;padding:10px 14px;
}
.stat{display:flex;align-items:center;gap:5px;font-weight:600;font-size:0.95rem;white-space:nowrap;font-variant-numeric:tabular-nums;}
#gold{color:var(--ember);}
.hpWrap{display:flex;align-items:center;gap:6px;}
.hpBarOuter{width:110px;height:10px;background:#1c1c1c;border-radius:5px;overflow:hidden;border:1px solid #333;}
#hpBarFill{height:100%;background:linear-gradient(90deg,var(--blood),var(--blood-bright));width:100%;transition:width .2s;}
@media(prefers-reduced-motion:reduce){#hpBarFill{transition:none;}}
#startWaveBtn{
  margin-left:auto;background:linear-gradient(180deg,var(--moss-bright),var(--moss));color:#fff;
  border:1px solid var(--moss-bright);border-radius:6px;padding:9px 16px;font-weight:700;
  cursor:pointer;font-size:0.9rem;font-variant-numeric:tabular-nums;
}
#startWaveBtn:disabled{opacity:.75;cursor:default;}
#startWaveBtn:not(:disabled):hover{filter:brightness(1.15);}
#miniRestart{
  background:none;border:1px solid var(--line);color:var(--moonlight-dim);border-radius:6px;
  padding:8px 10px;cursor:pointer;font-size:0.9rem;
}
#miniRestart:hover{color:var(--moonlight);border-color:var(--moonlight-dim);}
button:focus-visible{outline:2px solid var(--ember-bright);outline-offset:2px;}
#canvasWrap{
  position:relative;border:3px solid var(--bark);border-radius:8px;overflow:hidden;
  box-shadow:inset 0 0 70px 35px rgba(0,0,0,0.65),0 4px 20px rgba(0,0,0,0.5);
  background:var(--pine);
}
canvas{display:block;width:100%;height:auto;aspect-ratio:8/5;}
#upgrades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.upBtn{
  background:var(--panel-bg);border:1px solid var(--line);color:var(--moonlight);border-radius:7px;
  padding:8px 6px;cursor:pointer;font-size:0.78rem;line-height:1.5;text-align:center;
  transition:background .15s,border-color .15s;font-variant-numeric:tabular-nums;
}
.upBtn:hover:not(:disabled){background:rgba(74,122,63,0.3);border-color:var(--moss);}
.upBtn:disabled{opacity:.4;cursor:not-allowed;}
.uval{color:var(--ember);font-weight:700;}
.ucost{color:var(--moonlight-dim);font-size:0.72rem;}
#gameOverOverlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.82);display:flex;
  align-items:center;justify-content:center;z-index:10;
}
#gameOverOverlay.hidden{display:none;}
#gameOverPanel{background:var(--panel-bg);border:1px solid var(--line);border-radius:10px;padding:28px 36px;text-align:center;}
#gameOverPanel h2{color:var(--blood-bright);margin-top:0;font-family:Rockwell,'Bookman Old Style',Georgia,serif;}
#restartBtn{
  margin-top:14px;background:linear-gradient(180deg,var(--moss-bright),var(--moss));color:#fff;
  border:1px solid var(--moss-bright);border-radius:6px;padding:10px 22px;font-weight:700;
  cursor:pointer;font-size:0.95rem;
}
#restartBtn:hover{filter:brightness(1.15);}
@media(max-width:520px){
  #upgrades{grid-template-columns:repeat(2,1fr);}
  .stat{font-size:0.82rem;}
  h1{font-size:1.25rem;}
  #startWaveBtn{margin-left:0;width:100%;order:10;}
}
</style>
</head>
<body>
<div id="game">
  <h1>🌲 Dark Forest Defense</h1>
  <p class="subtitle">Defend your tower from waves of ogres</p>
  <div id="hud">
    <div class="stat">🌊 Wave <span id="waveNum">—</span></div>
    <div class="stat">💰 <span id="gold">100</span></div>
    <div class="stat hpWrap">❤️ <span id="hpText">100/100</span>
      <div class="hpBarOuter"><div id="hpBarFill"></div></div>
    </div>
    <button id="miniRestart" title="Restart">↺</button>
    <button id="startWaveBtn">Start Wave 1</button>
  </div>
  <div id="canvasWrap"><canvas id="canvas" width="800" height="500"></canvas></div>
  <div id="upgrades"></div>
</div>
<div id="gameOverOverlay" class="hidden">
  <div id="gameOverPanel">
    <h2>💀 Game Over</h2>
    <p>Reached Wave <b id="finalWave">0</b></p>
    <p>Total Gold Earned: <b id="finalGold">0</b></p>
    <button id="restartBtn">Restart</button>
  </div>
</div>
<script>
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const startWaveBtn=document.getElementById('startWaveBtn');

// ---- state ----
let wave=0,gold=100,totalGold=0,running=true,waveActive=false;
let enemiesToSpawn=0,spawnTimer=0,currentWaveCfg=null,hitFlashTimer=0,elapsed=0,lastTime=0;
const enemies=[],arrows=[],floatingTexts=[];
const tower={x:400,y:250,hp:100,maxHp:100,damage:12,fireRate:1.3,range:150,arrowSpeed:420,critChance:0.05,cooldown:0};
const TOWER_HIT_R2=32*32;

// ---- upgrades (add a new entry here + apply/display fns to expand) ----
const upgrades={
  hp:{name:'Tower HP',icon:'❤️',base:25,mult:1.35,lvl:0,apply:()=>{tower.maxHp+=20;tower.hp+=20;},display:()=>tower.maxHp},
  dmg:{name:'Damage',icon:'⚔️',base:30,mult:1.3,lvl:0,apply:()=>{tower.damage+=4;},display:()=>tower.damage},
  rate:{name:'Fire Rate',icon:'⚡',base:35,mult:1.35,lvl:0,apply:()=>{tower.fireRate=+(tower.fireRate+0.15).toFixed(2);},display:()=>tower.fireRate.toFixed(2)},
  range:{name:'Range',icon:'🎯',base:25,mult:1.28,lvl:0,apply:()=>{tower.range+=18;},display:()=>tower.range},
  aspd:{name:'Arrow Spd',icon:'🏹',base:20,mult:1.25,lvl:0,apply:()=>{tower.arrowSpeed+=60;},display:()=>tower.arrowSpeed},
  crit:{name:'Crit %',icon:'💥',base:40,mult:1.4,lvl:0,apply:()=>{tower.critChance=Math.min(0.75,tower.critChance+0.04);},display:()=>Math.round(tower.critChance*100)+'%'}
};
const upgradesPanel=document.getElementById('upgrades');
for(const key in upgrades){
  const btn=document.createElement('button');
  btn.className='upBtn';btn.id='u-'+key;
  btn.onclick=()=>buyUpgrade(key);
  upgradesPanel.appendChild(btn);
}
function upgradeCost(u){return Math.floor(u.base*Math.pow(u.mult,u.lvl));}
function buyUpgrade(key){
  const u=upgrades[key],cost=upgradeCost(u);
  if(gold<cost)return;
  gold-=cost;u.lvl++;u.apply();
  updateHUD();
}
function renderUpgrades(){
  for(const key in upgrades){
    const u=upgrades[key],cost=upgradeCost(u),btn=document.getElementById('u-'+key);
    btn.innerHTML=`${u.icon} ${u.name}<br><span class="uval">${u.display()}</span> · <span class="ucost">${cost}g</span>`;
    btn.disabled=gold<cost;
  }
}

// ---- background: drawn once to an offscreen canvas, then reused every frame ----
const bgCanvas=document.createElement('canvas');
bgCanvas.width=canvas.width;bgCanvas.height=canvas.height;
(function drawBackground(){
  const b=bgCanvas.getContext('2d');
  const g=b.createLinearGradient(0,0,0,canvas.height);
  g.addColorStop(0,'#1a2e1c');g.addColorStop(1,'#0a1510');
  b.fillStyle=g;b.fillRect(0,0,canvas.width,canvas.height);
  // grass tufts
  b.strokeStyle='rgba(120,160,100,0.15)';b.lineWidth=1;
  for(let i=0;i<140;i++){
    const x=Math.random()*canvas.width,y=Math.random()*canvas.height;
    b.beginPath();b.moveTo(x,y);b.lineTo(x+(Math.random()*6-3),y-6-Math.random()*4);b.stroke();
  }
  // signature: warm lantern glow baked around the tower, pushing back the dark
  const glow=b.createRadialGradient(400,250,20,400,250,260);
  glow.addColorStop(0,'rgba(232,163,61,0.22)');
  glow.addColorStop(1,'rgba(232,163,61,0)');
  b.fillStyle=glow;b.fillRect(0,0,canvas.width,canvas.height);
  // pine trees ringing the clearing
  function tree(x,y,s){
    b.fillStyle='#2e2117';b.fillRect(x-2,y,4,10);
    b.fillStyle='#132218';
    for(let i=0;i<3;i++){
      const w=s-i*s*0.28,h=s*0.45;
      b.beginPath();b.moveTo(x,y-h*(i+1));b.lineTo(x-w/2,y-h*i+4);b.lineTo(x+w/2,y-h*i+4);b.closePath();b.fill();
    }
  }
  for(let i=0;i<20;i++){
    let x,y;
    if(Math.random()<0.5){x=Math.random()*canvas.width;y=Math.random()<0.5?10+Math.random()*40:canvas.height-10-Math.random()*30;}
    else{x=Math.random()<0.5?10+Math.random()*40:canvas.width-10-Math.random()*40;y=Math.random()*canvas.height;}
    tree(x,y,26+Math.random()*18);
  }
})();

// ---- helpers ----
function hpColor(r){return r>0.5?'#4a7a3f':r>0.25?'#e8a33d':'#b8433c';}
function spawnFloatingText(x,y,text,color){floatingTexts.push({x,y,text,color,life:0.8});}

// ---- wave scaling (tweak the formulas here to rebalance difficulty) ----
function waveConfig(w){
  return{
    count:4+Math.floor(w*1.8),
    hp:Math.round(25*Math.pow(1.13,w-1)),
    speed:Math.min(95,38+w*2.2),
    goldReward:4+Math.floor(w*0.6),
    spawnInterval:Math.max(0.25,0.75-w*0.015)
  };
}
function startWave(){
  if(waveActive)return;
  wave++;
  currentWaveCfg=waveConfig(wave);
  enemiesToSpawn=currentWaveCfg.count;
  spawnTimer=0;waveActive=true;
  startWaveBtn.disabled=true;
  updateHUD();
}
function spawnEnemyEdge(){
  const cfg=currentWaveCfg;
  let x,y;const edge=Math.floor(Math.random()*4);
  if(edge===0){x=-20;y=Math.random()*canvas.height;}
  else if(edge===1){x=canvas.width+20;y=Math.random()*canvas.height;}
  else if(edge===2){x=Math.random()*canvas.width;y=-20;}
  else{x=Math.random()*canvas.width;y=canvas.height+20;}
  const dx=tower.x-x,dy=tower.y-y,d=Math.hypot(dx,dy);
  enemies.push({x,y,dx:dx/d,dy:dy/d,hp:cfg.hp,maxHp:cfg.hp,speed:cfg.speed,size:14+Math.min(8,wave*0.25),goldReward:cfg.goldReward,hitFlash:0,phase:Math.random()*10,active:true});
}

// ---- update ----
function updateSpawning(dt){
  if(!waveActive)return;
  if(enemiesToSpawn>0){
    spawnTimer-=dt;
    if(spawnTimer<=0){spawnEnemyEdge();enemiesToSpawn--;spawnTimer=currentWaveCfg.spawnInterval;updateHUD();}
  }else if(enemies.length===0){
    waveActive=false;
    const bonus=10+wave*2;gold+=bonus;totalGold+=bonus;
    startWaveBtn.disabled=false;startWaveBtn.textContent=`Start Wave ${wave+1}`;
    updateHUD();
  }
}
function updateEnemies(dt){
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    e.x+=e.dx*e.speed*dt;e.y+=e.dy*e.speed*dt;
    if(e.hitFlash>0)e.hitFlash-=dt;
    const ddx=e.x-tower.x,ddy=e.y-tower.y;
    if(ddx*ddx+ddy*ddy<TOWER_HIT_R2){
      const dmg=6+Math.floor(wave*0.4);
      tower.hp=Math.max(0,tower.hp-dmg);
      e.active=false;enemies.splice(i,1);hitFlashTimer=0.15;
      updateHUD();
      if(tower.hp<=0){gameOver();return;}
      continue;
    }
    if(e.hp<=0){
      e.active=false;
      gold+=e.goldReward;totalGold+=e.goldReward;
      spawnFloatingText(e.x,e.y,'+'+e.goldReward,'#e8a33d');
      enemies.splice(i,1);
      updateHUD();
    }
  }
}
function findTarget(){
  let best=null,bestD=tower.range*tower.range;
  for(const e of enemies){
    const dx=e.x-tower.x,dy=e.y-tower.y,d=dx*dx+dy*dy;
    if(d<=bestD){bestD=d;best=e;}
  }
  return best;
}
function updateTower(dt){
  tower.cooldown-=dt;
  if(tower.cooldown<=0){
    const t=findTarget();
    if(t){
      const isCrit=Math.random()<tower.critChance;
      arrows.push({x:tower.x,y:tower.y-35,target:t,speed:tower.arrowSpeed,damage:isCrit?tower.damage*2:tower.damage,isCrit,angle:0});
      tower.cooldown=1/tower.fireRate;
    }
  }
}
function updateArrows(dt){
  for(let i=arrows.length-1;i>=0;i--){
    const a=arrows[i],t=a.target;
    if(!t.active){arrows.splice(i,1);continue;}
    const dx=t.x-a.x,dy=t.y-a.y,dist=Math.hypot(dx,dy);
    a.angle=Math.atan2(dy,dx);
    if(dist<10){
      t.hp-=a.damage;t.hitFlash=0.1;
      spawnFloatingText(t.x,t.y-14,(a.isCrit?'CRIT ':'')+Math.round(a.damage),a.isCrit?'#ffc860':'#d9e4d2');
      arrows.splice(i,1);continue;
    }
    a.x+=(dx/dist)*a.speed*dt;a.y+=(dy/dist)*a.speed*dt;
  }
}
function updateTexts(dt){
  for(let i=floatingTexts.length-1;i>=0;i--){
    const f=floatingTexts[i];f.y-=30*dt;f.life-=dt;
    if(f.life<=0)floatingTexts.splice(i,1);
  }
}

// ---- render ----
function drawTower(){
  ctx.save();
  ctx.beginPath();ctx.arc(tower.x,tower.y,tower.range,0,Math.PI*2);
  ctx.strokeStyle='rgba(99,153,80,0.18)';ctx.setLineDash([5,5]);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='#4a3728';ctx.fillRect(tower.x-22,tower.y-10,44,52);
  ctx.beginPath();ctx.moveTo(tower.x-30,tower.y-10);ctx.lineTo(tower.x,tower.y-55);ctx.lineTo(tower.x+30,tower.y-10);ctx.closePath();
  ctx.fillStyle='#2e2117';ctx.fill();
  const bob=Math.sin(elapsed*2.5)*3;
  ctx.beginPath();ctx.arc(tower.x,tower.y-45+bob,6,0,Math.PI*2);
  ctx.fillStyle='#e8a33d';ctx.shadowColor='#e8a33d';ctx.shadowBlur=12;ctx.fill();
  ctx.restore();
}
function drawEnemy(e){
  const bob=Math.sin(elapsed*6+e.phase)*2,ey=e.y+bob;
  ctx.fillStyle=e.hitFlash>0?'#fff':'#4a6b3a';
  ctx.beginPath();ctx.ellipse(e.x,ey,e.size,e.size*0.85,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#33502a';
  ctx.beginPath();ctx.ellipse(e.x,ey+e.size*0.35,e.size*0.5,e.size*0.3,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#e8483d';
  ctx.beginPath();ctx.arc(e.x-e.size*0.3,ey-e.size*0.15,2.5,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(e.x+e.size*0.3,ey-e.size*0.15,2.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#eee';
  ctx.beginPath();ctx.moveTo(e.x-e.size*0.25,ey+e.size*0.2);ctx.lineTo(e.x-e.size*0.1,ey+e.size*0.5);ctx.lineTo(e.x-e.size*0.35,ey+e.size*0.4);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(e.x+e.size*0.25,ey+e.size*0.2);ctx.lineTo(e.x+e.size*0.1,ey+e.size*0.5);ctx.lineTo(e.x+e.size*0.35,ey+e.size*0.4);ctx.closePath();ctx.fill();
  ctx.fillStyle='#222';ctx.fillRect(e.x-18,e.y-e.size-11,36,5);
  ctx.fillStyle=hpColor(e.hp/e.maxHp);ctx.fillRect(e.x-18,e.y-e.size-11,36*Math.max(0,e.hp/e.maxHp),5);
}
function drawArrow(a){
  ctx.save();ctx.translate(a.x,a.y);ctx.rotate(a.angle);
  ctx.strokeStyle='#ffc860';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(-8,0);ctx.lineTo(7,0);ctx.stroke();
  ctx.fillStyle='#ffc860';ctx.beginPath();ctx.moveTo(9,0);ctx.lineTo(3,-3);ctx.lineTo(3,3);ctx.closePath();ctx.fill();
  ctx.restore();
}
function render(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(bgCanvas,0,0);
  drawTower();
  for(const e of enemies)drawEnemy(e);
  for(const a of arrows)drawArrow(a);
  ctx.textAlign='center';ctx.font='bold 13px sans-serif';
  for(const f of floatingTexts){ctx.globalAlpha=Math.max(0,f.life/0.8);ctx.fillStyle=f.color;ctx.fillText(f.text,f.x,f.y);}
  ctx.globalAlpha=1;
  if(hitFlashTimer>0){ctx.fillStyle=`rgba(184,67,60,${hitFlashTimer*1.1})`;ctx.fillRect(0,0,canvas.width,canvas.height);}
}

// ---- HUD ----
function updateHUD(){
  document.getElementById('waveNum').textContent=wave===0?'—':wave;
  document.getElementById('gold').textContent=gold;
  document.getElementById('hpText').textContent=Math.ceil(tower.hp)+'/'+tower.maxHp;
  document.getElementById('hpBarFill').style.width=Math.max(0,tower.hp/tower.maxHp*100)+'%';
  if(waveActive)startWaveBtn.textContent=`Enemies: ${enemies.length+enemiesToSpawn}`;
  renderUpgrades();
}

// ---- game flow ----
function gameOver(){
  running=false;
  document.getElementById('finalWave').textContent=wave;
  document.getElementById('finalGold').textContent=totalGold;
  document.getElementById('gameOverOverlay').classList.remove('hidden');
}
function resetGame(){
  wave=0;gold=100;totalGold=0;running=true;waveActive=false;enemiesToSpawn=0;spawnTimer=0;hitFlashTimer=0;
  tower.hp=100;tower.maxHp=100;tower.damage=12;tower.fireRate=1.3;tower.range=150;tower.arrowSpeed=420;tower.critChance=0.05;tower.cooldown=0;
  for(const k in upgrades)upgrades[k].lvl=0;
  enemies.length=0;arrows.length=0;floatingTexts.length=0;
  startWaveBtn.disabled=false;startWaveBtn.textContent='Start Wave 1';
  document.getElementById('gameOverOverlay').classList.add('hidden');
  updateHUD();
}

// ---- events ----
startWaveBtn.onclick=startWave;
document.getElementById('restartBtn').onclick=resetGame;
document.getElementById('miniRestart').onclick=resetGame;

// ---- main loop ----
function loop(ts){
  const dt=Math.min((ts-lastTime)/1000,0.05);
  lastTime=ts;elapsed+=dt;
  if(running){
    updateSpawning(dt);updateEnemies(dt);updateTower(dt);updateArrows(dt);updateTexts(dt);
    if(hitFlashTimer>0)hitFlashTimer=Math.max(0,hitFlashTimer-dt);
  }
  render();
  requestAnimationFrame(loop);
}
updateHUD();
requestAnimationFrame(loop);
</script>
</body>
</html>
